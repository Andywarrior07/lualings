[package]
name = "lualings"
version = "0.1.0"
edition = "2024"
authors = ["Andy Guerrero <contacto@andresguerrero.dev>"]
description = "Learn and practice Lua with interactive exercises, inspired by Rustlings"
license = "MIT"
repository = "https://github.com/Andywarrior07/lualings"
readme = "README.md"
keywords = ["lua", "learning", "cli", "exercises"]
categories = ["command-line-utilities", "development-tools"]
include = [
  "src/**",
  "exercises/**",
  "solutions/**",
  "projects/**",
  "/info.json",
  "/LICENSE",
  "/CHANGELOG.md",
  "/README.md",
  "/Cargo.toml",
]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
include_dir = "0.7.4"
mlua = { version = "0.12.0", features = ["lua54", "vendored"] }
notify = "8.2.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3"
